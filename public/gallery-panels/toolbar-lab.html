<section class="specimen">
<h3>Playground — configure one Toolbar</h3>
<div class="nlab" data-nlab="toolbar">
<div class="nlab__bar">
<div class="nlab__group" role="group" aria-label="Density"><span class="nlab__label">Density</span><button class="nlab__pill" data-nlab-density="comfortable">Comfortable</button><button class="nlab__pill is-on" data-nlab-density="default">Default</button><button class="nlab__pill" data-nlab-density="compact">Compact</button></div>
<div class="nlab__group nlab__group--right" role="group" aria-label="Options"><label class="nlab__check"><input type="checkbox" data-nlab-overflow checked> Overflow</label></div>
</div>
<div class="nlab__stage" data-nlab-stage data-surface="canvas" data-theme="light">
<div data-nlab-preview style="width:100%"></div>
<p class="nlab__hint meta" data-nlab-note>Groups divide kin · spacer pins tail · overflow menus spill</p>
</div>
<div class="nlab__bar nlab__bar--foot">
<div class="nlab__group" role="group" aria-label="Stage surface"><span class="nlab__label">Stage</span><button class="nlab__pill is-on" data-nlab-surface="canvas">Canvas</button><button class="nlab__pill" data-nlab-surface="surface">Surface</button><button class="nlab__pill" data-nlab-surface="wash">Wash</button></div>
<div class="nlab__group nlab__group--right" role="group" aria-label="Color scheme"><span class="nlab__label">Scheme</span><button class="nlab__pill is-on" data-nlab-scheme="light">Light</button><button class="nlab__pill" data-nlab-scheme="dark">Dark</button></div>
</div>
<div class="nlab__edit">
<label class="nlab__field">Density<select data-nlab-density><option value="comfortable">Comfortable (56px)</option><option value="default" selected>Default (44px)</option><option value="compact">Compact (--spacing-8)</option></select></label>
<label class="nlab__field">Title<input data-nlab-title value="Acme renewal" maxlength="24"></label>
<label class="nlab__field">Groups<select data-nlab-groups><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
<label class="nlab__check"><input type="checkbox" data-nlab-overflow checked> Overflow menu</label>
</div>
<div class="nlab__code">
<pre><code class="tp-code" data-nlab-code></code></pre>
<span class="nlab__ratio" data-nlab-ratio>Aa — · —</span>
<button class="nlab__copy" data-nlab-copy aria-label="Copy snippet"><i class="ph-bold ph-copy" aria-hidden="true"></i></button>
</div>
</div>
<p class="spec-note">Actions in formation — groups divide kin, spacer pins tail, overflow menus spill; density never drops actions. Reject: action soup, or labels shoving actions off-screen.</p>
</section>

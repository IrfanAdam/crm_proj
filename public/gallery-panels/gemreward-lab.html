<section class="specimen">
<h3>Playground — configure one GemReward</h3>
<div class="carlab" data-carlab="gemreward">
<div class="carlab__bar">
<div class="carlab__group" role="group" aria-label="Category">
<span class="carlab__label">Category</span>
<select data-gem-category aria-label="Gem category"><option value="sapphire" selected>Sapphire</option><option value="citrine">Citrine</option><option value="redberyl">Red Beryl</option><option value="amethyst">Amethyst</option></select>
</div>
<div class="carlab__group" role="group" aria-label="Ceremony">
<label class="carlab__field" style="flex-direction:row;align-items:center">Ceremony<input type="checkbox" data-gem-ceremony checked></label>
</div>
</div>
<div class="carlab__stage" data-carlab-stage data-surface="canvas" data-theme="light">
<div data-carlab-preview></div>
</div>
<div class="carlab__bar carlab__bar--foot">
<div class="carlab__group" role="group" aria-label="Stage surface">
<span class="carlab__label">Stage</span>
<button class="carlab__pill is-on" data-carlab-surface="canvas">Canvas</button>
<button class="carlab__pill" data-carlab-surface="surface">Surface</button>
<button class="carlab__pill" data-carlab-surface="wash">Wash</button>
</div>
<div class="carlab__group" role="group" aria-label="Color scheme">
<span class="carlab__label">Scheme</span>
<button class="carlab__pill is-on" data-carlab-scheme="light">Light</button>
<button class="carlab__pill" data-carlab-scheme="dark">Dark</button>
</div>
</div>
<div class="carlab__edit">
<label class="carlab__field">Title<input data-gem-title value="Rock Solid Goals" maxlength="24"></label>
<label class="carlab__field">Capsule<input data-gem-capsule value="+Rs 4lakh · Beyond Target" maxlength="28"></label>
<label class="carlab__field">Copy<input data-gem-copy value="data in here don’t lie" maxlength="32"></label>
</div>
<div class="carlab__code">
<pre><code class="hl" data-carlab-code></code></pre>
<span class="carlab__ratio" data-carlab-ratio>Aa —</span>
<button class="carlab__copy" data-carlab-copy aria-label="Copy snippet"><i class="ph-bold ph-copy" aria-hidden="true"></i></button>
</div>
</div>
<p class="spec-note">One procedural cut + token color per category · capsule stand · ceremony-only quarantine · reduced-motion fallback.</p>
</section>

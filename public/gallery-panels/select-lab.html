<section class="specimen">
<h3>Playground — Select</h3>
<div class="flab" data-flab="select">
<div class="flab__bar">
<div class="flab__group" role="group" aria-label="Variant">
<span class="flab__label">Variant</span>
<button class="flab__pill is-on" data-flab-variant="outlined">Outlined</button>
<button class="flab__pill" data-flab-variant="filled">Filled</button>
</div>
<div class="flab__group" role="group" aria-label="Size">
<span class="flab__label">Size</span>
<button class="flab__pill" data-flab-size="sm">SM</button>
<button class="flab__pill is-on" data-flab-size="md">MD</button>
<button class="flab__pill" data-flab-size="lg">LG</button>
</div>
<div class="flab__group" role="group" aria-label="State">
<span class="flab__label">State</span>
<button class="flab__pill is-on" data-flab-state="default">Default</button>
<button class="flab__pill" data-flab-state="focus">Focus</button>
<button class="flab__pill" data-flab-state="error">Error</button>
<button class="flab__pill" data-flab-state="disabled">Disabled</button>
</div>
</div>
<div class="flab__stage" data-flab-stage data-surface="canvas" data-theme="light">
<div class="flab__preview" data-flab-preview></div>
</div>
<div class="flab__bar flab__bar--foot">
<div class="flab__group" role="group" aria-label="Stage surface">
<span class="flab__label">Stage</span>
<button class="flab__pill is-on" data-flab-surface="canvas">Canvas</button>
<button class="flab__pill" data-flab-surface="surface">Surface</button>
<button class="flab__pill" data-flab-surface="wash">Wash</button>
</div>
<div class="flab__group" role="group" aria-label="Color scheme">
<span class="flab__label">Scheme</span>
<button class="flab__pill is-on" data-flab-scheme="light">Light</button>
<button class="flab__pill" data-flab-scheme="dark">Dark</button>
</div>
</div>
<div class="flab__edit">
<label class="flab__field">Label<input data-flab-label value="Stage"></label>
<label class="flab__field">Options (comma)<input data-flab-options value="Prospecting,Negotiation,Closed"></label>
<label class="flab__field">Chevron<input data-flab-chevron value="ph-caret-down"></label>
</div>
<div class="flab__code">
<pre><code class="tp-code" data-flab-code></code></pre>
<span class="flab__ratio" data-flab-ratio>Aa —</span>
<button class="flab__copy" data-flab-copy aria-label="Copy snippet"><i class="ph-bold ph-copy" aria-hidden="true"></i></button>
</div>
</div>
<p class="spec-note">Native select with chevron — outlined vs filled, 44px md, chevron rotates on focus-within. Edit label, comma options, chevron icon; error adds <code>aria-invalid</code>.</p>
</section>

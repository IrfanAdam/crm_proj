<link rel="stylesheet" href="src/ds/listrow-lab.css">
<section class="specimen">
<h3>Playground — configure one list row</h3>
<div class="dlab" data-dlab="listrow">
<div class="dlab__bar">
<div class="dlab__group" role="group" aria-label="State">
<span class="dlab__label">State</span>
<button class="dlab__pill is-on" data-listrow-state="default">Default</button>
<button class="dlab__pill" data-listrow-state="selected">Selected</button>
<button class="dlab__pill" data-listrow-state="disabled">Disabled</button>
</div>
<div class="dlab__group dlab__group--right" role="group" aria-label="End slot">
<label class="dlab__check"><input type="checkbox" data-listrow-badge checked> Badge</label>
<label class="dlab__check"><input type="checkbox" data-listrow-time checked> Time</label>
</div>
</div>
<div class="dlab__stage" data-dlab-stage data-surface="canvas" data-theme="light">
<div data-dlab-preview></div>
<p class="dlab__hint meta" data-dlab-note></p>
</div>
<div class="dlab__bar dlab__bar--foot">
<div class="dlab__group" role="group" aria-label="Stage surface">
<span class="dlab__label">Stage</span>
<button class="dlab__pill is-on" data-dlab-surface="canvas">Canvas</button>
<button class="dlab__pill" data-dlab-surface="surface">Surface</button>
<button class="dlab__pill" data-dlab-surface="wash">Wash</button>
</div>
<div class="dlab__group dlab__group--right" role="group" aria-label="Color scheme">
<span class="dlab__label">Scheme</span>
<button class="dlab__pill is-on" data-dlab-scheme="light">Light</button>
<button class="dlab__pill" data-dlab-scheme="dark">Dark</button>
</div>
</div>
<div class="dlab__edit">
<label class="dlab__field">Logo <input data-listrow-logo value="AC" maxlength="2"></label>
<label class="dlab__field">Name <input data-listrow-name value="Acme Corp"></label>
<label class="dlab__field">Meta <input data-listrow-meta value="Negotiation · $48k"></label>
<label class="dlab__field">Time <input data-listrow-timestamp value="2h ago"></label>
<label class="dlab__field">Badge <select data-listrow-tone><option value="">Default</option><option value="badge--success" selected>Success</option><option value="badge--warning">Warning</option><option value="badge--danger">Danger</option><option value="badge--neutral">Neutral</option></select></label>
</div>
<div class="dlab__code">
<pre><code class="tp-code" data-dlab-code></code></pre>
<span class="dlab__ratio" data-dlab-ratio>—</span>
<button class="dlab__copy" data-dlab-copy aria-label="Copy snippet"><i class="ph-bold ph-copy" aria-hidden="true"></i></button>
</div>
</div>
<p class="spec-note">Logo 32px · name ellipsizes · end slot Badge over time. Selected is wash + sapphire border; disabled dims and leaves tab order.</p>
</section>
<script src="src/ds/listrow-lab.js"></script>

<section class="specimen">
<h3>Playground — configure one FunnelCard</h3>
<div class="carlab" data-carlab="funnelcard">
<div class="carlab__bar">
<div class="carlab__group" role="group" aria-label="Glyph">
<span class="carlab__label">Glyph</span>
<select data-funnel-glyph aria-label="Glyph icon"><option value="ph-funnel" selected>Funnel</option><option value="ph-chart-bar">Chart</option><option value="ph-funnel-simple">Simple</option></select>
</div>
<div class="carlab__group" role="group" aria-label="Metrics count">
<span class="carlab__label">Strip</span>
<span class="meta">4 metrics · edit below</span>
</div>
</div>
<div class="carlab__stage" data-carlab-stage data-surface="canvas" data-theme="light">
<div data-carlab-preview></div>
</div>
<div class="carlab__bar carlab__bar--foot">
<div class="carlab__group" role="group" aria-label="Stage surface">
<span class="carlab__label">Stage</span>
<button class="carlab__pill is-on" data-carlab-surface="canvas">Canvas</button>
<button class="carlab__pill" data-carlab-surface="surface">Surface</button>
<button class="carlab__pill" data-carlab-surface="wash">Wash</button>
</div>
<div class="carlab__group" role="group" aria-label="Color scheme">
<span class="carlab__label">Scheme</span>
<button class="carlab__pill is-on" data-carlab-scheme="light">Light</button>
<button class="carlab__pill" data-carlab-scheme="dark">Dark</button>
</div>
</div>
<div class="carlab__edit">
<label class="carlab__field">Title<input data-funnel-title value="Pipeline health" maxlength="24"></label>
<label class="carlab__field">Meta stamp<input data-funnel-meta value="Last refreshed 9:41 AM" maxlength="28"></label>
<label class="carlab__field">Metric 1<input data-funnel-m1 value="CR 24%" maxlength="12"></label>
<label class="carlab__field">Metric 2<input data-funnel-m2 value="RR 61%" maxlength="12"></label>
<label class="carlab__field">Metric 3<input data-funnel-m3 value="CSAT 4.8" maxlength="12"></label>
<label class="carlab__field">Metric 4<input data-funnel-m4 value="NPS 52" maxlength="12"></label>
</div>
<div class="carlab__code">
<pre><code class="hl" data-carlab-code></code></pre>
<span class="carlab__ratio" data-carlab-ratio>Aa —</span>
<button class="carlab__copy" data-carlab-copy aria-label="Copy snippet"><i class="ph-bold ph-copy" aria-hidden="true"></i></button>
</div>
</div>
<p class="spec-note">Glyph · title · stamp · metrics strip — sapphire-100/500 glyph, metrics only in strip, hairline frame zero shadow.</p>
</section>

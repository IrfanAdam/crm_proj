<section class="specimen">
<h3>Playground — configure one chip</h3>
<div class="ilab" data-ilab="chip">
<div class="ilab__bar">
<div class="ilab__group" role="group" aria-label="Variant">
<span class="ilab__label">Variant</span>
<button class="ilab__pill is-on" data-ilab-variant="">Filter</button>
<button class="ilab__pill" data-ilab-variant="chip--selected">Selected</button>
<button class="ilab__pill" data-ilab-variant="chip--input">Input</button>
<button class="ilab__pill" data-ilab-variant="chip--suggestion">Suggestion</button>
</div>
<div class="ilab__group ilab__group--right" role="group" aria-label="Size and state">
<span class="ilab__label">Size</span>
<button class="ilab__pill is-on" data-ilab-size="">MD</button>
<button class="ilab__pill" data-ilab-size="chip--sm">SM</button>
<label class="ilab__label" for="chip-state">State</label>
<select class="ilab__select" id="chip-state" data-ilab-state>
<option value="default">Default</option>
<option value="disabled">Disabled</option>
<option value="aria-disabled">Aria-disabled</option>
</select>
</div>
</div>
<div class="ilab__stage" data-ilab-stage data-surface="canvas" data-theme="light">
<label class="ilab__check"><input type="checkbox" data-ilab-capsule> Concentric</label>
<div class="ilab__tune" data-ilab-tune hidden>
<label class="ilab__range"><span>Pad</span><input type="range" data-ilab-pad min="8" max="48" step="4" value="12"><output data-ilab-pad-val>12px</output></label>
<label class="ilab__range"><span>Radius</span><input type="range" data-ilab-radius min="8" max="48" step="4" value="32"><output data-ilab-radius-val>32px</output></label>
</div>
<div data-ilab-preview data-ilab-hue="neutral"></div>
<p class="ilab__hint meta" data-ilab-note></p>
</div>
<div class="ilab__bar ilab__bar--foot">
<div class="ilab__group" role="group" aria-label="Stage surface">
<span class="ilab__label">Stage</span>
<button class="ilab__pill is-on" data-ilab-surface="canvas">Canvas</button>
<button class="ilab__pill" data-ilab-surface="surface">Surface</button>
<button class="ilab__pill" data-ilab-surface="wash">Wash</button>
</div>
<div class="ilab__group ilab__group--right" role="group" aria-label="Color scheme">
<span class="ilab__label">Scheme</span>
<button class="ilab__pill is-on" data-ilab-scheme="light">Light</button>
<button class="ilab__pill" data-ilab-scheme="dark">Dark</button>
</div>
</div>
<div class="ilab__edit">
<label class="ilab__field">Label<input data-ilab-label value="Value range" maxlength="24"></label>
<label class="ilab__field ilab__field--sm">Count<input data-ilab-count value="4" maxlength="4"></label>
<label class="ilab__check"><input type="checkbox" data-ilab-hascount checked> Show count</label>
<label class="ilab__check"><input type="checkbox" data-ilab-close> Close ×</label>
</div>
<div class="ilab__code">
<pre><code class="tp-code" data-ilab-code></code></pre>
<span class="ilab__ratio" data-ilab-ratio>Aa — · —</span>
<button class="ilab__copy" data-ilab-copy aria-label="Copy snippet"><i class="ph-bold ph-copy" aria-hidden="true"></i></button>
</div>
</div>
<p class="spec-note">Chip filters — toggle via <code>chip--selected</code> + <code>aria-pressed</code>; suggestion never selected. Concentric nests pill in <code>ilab-box</code> (pad 8–48, radius 8–48); radius snaps to 4px grid, min 8.</p>
</section>

<section class="specimen">
<h3>Playground — configure one ProfileCard</h3>
<div class="carlab" data-carlab="profilecard">
<div class="carlab__bar">
<div class="carlab__group" role="group" aria-label="Avatar">
<span class="carlab__label">Avatar</span>
<span class="meta">64px · centered</span>
</div>
<div class="carlab__group" role="group" aria-label="Stats">
<span class="carlab__label">Stats</span>
<span class="meta">Trio only</span>
</div>
</div>
<div class="carlab__stage" data-carlab-stage data-surface="canvas" data-theme="light">
<div data-carlab-preview></div>
</div>
<div class="carlab__bar carlab__bar--foot">
<div class="carlab__group" role="group" aria-label="Stage surface">
<span class="carlab__label">Stage</span>
<button class="carlab__pill is-on" data-carlab-surface="canvas">Canvas</button>
<button class="carlab__pill" data-carlab-surface="surface">Surface</button>
<button class="carlab__pill" data-carlab-surface="wash">Wash</button>
</div>
<div class="carlab__group" role="group" aria-label="Color scheme">
<span class="carlab__label">Scheme</span>
<button class="carlab__pill is-on" data-carlab-scheme="light">Light</button>
<button class="carlab__pill" data-carlab-scheme="dark">Dark</button>
</div>
</div>
<div class="carlab__edit">
<label class="carlab__field">Avatar initials<input data-profile-avatar value="OK" maxlength="3"></label>
<label class="carlab__field">Name<input data-profile-name value="Olivia Kang" maxlength="24"></label>
<label class="carlab__field">Role<input data-profile-role value="Regional rep · West" maxlength="28"></label>
<label class="carlab__field carlab__field--sm">Val 1<input data-profile-v1 value="128" maxlength="6"></label>
<label class="carlab__field carlab__field--sm">Label 1<input data-profile-l1 value="Deals" maxlength="10"></label>
<label class="carlab__field carlab__field--sm">Val 2<input data-profile-v2 value="96%" maxlength="6"></label>
<label class="carlab__field carlab__field--sm">Label 2<input data-profile-l2 value="Quota" maxlength="10"></label>
<label class="carlab__field carlab__field--sm">Val 3<input data-profile-v3 value="4.9" maxlength="6"></label>
<label class="carlab__field carlab__field--sm">Label 3<input data-profile-l3 value="CSAT" maxlength="10"></label>
</div>
<div class="carlab__code">
<pre><code class="hl" data-carlab-code></code></pre>
<span class="carlab__ratio" data-carlab-ratio>Aa —</span>
<button class="carlab__copy" data-carlab-copy aria-label="Copy snippet"><i class="ph-bold ph-copy" aria-hidden="true"></i></button>
</div>
</div>
<p class="spec-note">Avatar · name · role · stat trio — centered axis, hairline avatar ring + stat rule, zero shadow.</p>
</section>

<!-- ADAM/PAGE — public/pitch/masthead.html · sticky masthead bar -->
<header class="masthead">
  <div class="masthead-brand">AlphaGems</div>
  <div class="masthead-right">
    <label class="masthead-version" aria-label="Pitch version">
      <select id="pitch-version" class="masthead-version__select">
        <option value="v1">v1 — Original</option>
        <option value="v2">v2 — Intent → Behavior</option>
      </select>
      <span class="masthead-version__chevron" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 4 L6 8 L10 4"/></svg></span>
    </label>
    <div class="masthead-tag">Position Bible · 2026</div>
    <button class="masthead-close" data-pitch-close hidden aria-label="Close pitch">✕</button>
  </div>
</header>

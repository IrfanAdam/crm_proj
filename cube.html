<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALPHA CRM — Intelligence Cube</title>
<link rel="stylesheet" href="design-system/tokens.css"/>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--primitive-sapphire-ui-50);color:var(--text-primary);font-family:var(--font-family-sans)}
.cube-stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--spacing-6);padding:var(--spacing-8) 0}
.cube-stage__frame{width:min(82vmin,760px);aspect-ratio:1}
.cube-stage canvas{width:100%;height:100%;display:block}
.cube-stage__caption{font-size:var(--font-size-xs);letter-spacing:var(--font-tracking-wide);text-transform:uppercase;color:var(--text-muted)}
</style>
</head>
<body>
<main class="cube-stage">
<div class="cube-stage__frame">
<canvas data-cube role="img" aria-label="Intelligence cube — a glass block holding an amorphous glowing core"></canvas>
</div>
<p class="cube-stage__caption">Intelligence cube — ALPHA DS · three r160</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="src/components/GemReward/gem-env.js"></script>
<script src="src/components/GemReward/gem-textures.js"></script>
<script src="src/components/IntelCube/cube-form.js"></script>
<script src="src/components/IntelCube/cube-core.js"></script>
<script src="src/components/IntelCube/cube-scene.js"></script>
<script src="src/components/IntelCube/cube-dress.js"></script>
<script src="src/components/IntelCube/cube3d.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALPHA CRM — Illusion Cube</title>
<link rel="stylesheet" href="design-system/tokens.css"/>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--primitive-sapphire-ui-50);color:var(--text-primary);font-family:var(--font-family-sans)}
.cube-stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--spacing-6);padding:var(--spacing-8) 0}
.cube-stage__frame{width:min(82vmin,760px);aspect-ratio:1}
.cube-stage canvas{width:100%;height:100%;display:block}
.cube-stage__caption{font-size:var(--font-size-xs);letter-spacing:var(--font-tracking-wide);text-transform:uppercase;color:var(--text-muted)}
</style>
</head>
<body>
<main class="cube-stage">
<div class="cube-stage__frame">
<canvas data-illusion role="img" aria-label="Illusion cube — gray rounded box on plinth, native three.js scaffold"></canvas>
</div>
<p class="cube-stage__caption">Illusion cube — Spline illusioncube recreated natively · three r160</p>
<p class="cube-stage__caption"><button id="illusion-sound" type="button" aria-pressed="true" style="font:inherit;color:inherit;background:none;border:1px solid currentColor">Sound: on</button> <span id="illusion-status">armed</span></p>
<script>
(function () {
var b = document.getElementById('illusion-sound');
var s = document.getElementById('illusion-status');
if (window.ILLUSION_AUDIO) window.ILLUSION_AUDIO.arm();
var paint = function () {
if (!window.ILLUSION_AUDIO || !b || !s) return;
var st = window.ILLUSION_AUDIO.status();
s.textContent = st;
b.textContent = 'Sound: ' + (st === 'muted' ? 'off' : 'on');
b.setAttribute('aria-pressed', st === 'muted' ? 'false' : 'true');
};
if (b) b.addEventListener('click', function () { if (window.ILLUSION_AUDIO) window.ILLUSION_AUDIO.toggle(); paint(); });
setInterval(paint, 1000);
paint();
})();
</script>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
